name: Publish RHDH Release Dynamic Plugin Images
on:
  workflow_call:
    inputs:
      workspace-path:
        description: >
          Single overlay workspace (e.g. workspaces/todo). When set, the allow-list
          file is ignored. When empty, workspaces are read from
          parasol-publish-workspaces.txt (empty file = publish nothing).
        type: string
        required: false
        default: ''
      overlay-branch:
        description: Overlay git ref to export. Defaults to the caller ref.
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}-${{ inputs.overlay-branch }}-${{ inputs.workspace-path }}
  cancel-in-progress: true

jobs:
  resolve-workspaces:
    runs-on: ubuntu-latest
    name: Resolve workspaces
    outputs:
      workspaces: ${{ steps.list.outputs.workspaces }}
    steps:
      - name: Checkout overlay
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.overlay-branch || github.ref }}

      - name: Read publish allow-list
        id: list
        env:
          WORKSPACE_PATH: ${{ inputs.workspace-path }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          explicit = os.environ.get("WORKSPACE_PATH", "").strip()
          if explicit:
              workspaces = [explicit]
          else:
              workspaces = []
              path = Path("parasol-publish-workspaces.txt")
              if path.is_file():
                  for raw in path.read_text(encoding="utf-8").splitlines():
                      line = raw.split("#", 1)[0].strip()
                      if not line:
                          continue
                      if not line.startswith("workspaces/"):
                          line = f"workspaces/{line}"
                      workspaces.append(line)
              else:
                  print(
                      "::warning::parasol-publish-workspaces.txt is missing; publishing nothing",
                      file=sys.stderr,
                  )

          print(f"Workspaces to publish: {json.dumps(workspaces)}", file=sys.stderr)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("workspaces=" + json.dumps(workspaces) + "\n")
          PY

  prepare:
    runs-on: ubuntu-latest
    name: Prepare
    outputs:
      last-published-commit: ${{ steps.get-last-published-commit.outputs.last-published-commit }}

    steps:
      - name: Get last published commit
        id: get-last-published-commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_RELEASE_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            core.info(`Getting latest commit on branch ${core.getInput('release_branch')}`);

            const currentRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const workflowId = currentRun.data.workflow_id;

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: core.getInput('release_branch'),
              status: 'success',
              per_page: 10,
              exclude_pull_requests: true,
            });

            for (const run of runs.data.workflow_runs) {
              if (context.payload.commits && context.payload.commits.some(c => c.id === run.head_sha)) {
                core.info(`Skipping run ${run.id} for commit ${run.head_sha}, it's part of the push`);
                continue;
              }

              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'latest',
              });

              const exportJobs = jobs.data.jobs.filter(j =>
                j.name.startsWith('export') && j.conclusion !== 'skipped'
              );
              if (exportJobs.length > 0 && exportJobs.every(j => j.conclusion === 'success')) {
                core.info(`Last published commit to compare with: ${run.head_sha}`);
                core.setOutput('last-published-commit', run.head_sha);
                return;
              }
              core.info(`Skipping run ${run.id} for commit ${run.head_sha}: export jobs not all successful`);
            }

            core.info('Last published commit not found');
            core.setOutput('last-published-commit', '');

  export:
    uses: redhat-developer/rhdh-plugin-export-utils/.github/workflows/export-workspaces-as-dynamic.yaml@main
    needs:
      - resolve-workspaces
      - prepare
    if: needs.resolve-workspaces.outputs.workspaces != '[]'
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.resolve-workspaces.outputs.workspaces) }}

    with:
      publish-container: true
      workspace-path: ${{ matrix.workspace }}
      overlay-branch: ${{ inputs.overlay-branch }}
      image-repository-prefix: ${{ format('ghcr.io/{0}', github.repository) }}
      last-publish-commit: ${{ needs.prepare.outputs.last-published-commit }}
      # use empty prefix so that we will prepend bs_1.yy.z__ instead of next__
      image-tag-prefix: ${{ '' }}
      image-registry-user: ${{ github.actor }}

    secrets:
      image-registry-password: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write
      attestations: write
      packages: write
      id-token: write
