# This file is managed by 'fullsend repos': repos-config-v1
# Do not edit this file directly; changes will be overwritten.
tracker:
    github:
        allowed_targets:
            repos:
                - rhdh-parasol/rhdh-plugin-export-overlays
                - fullsend-ai/fullsend
runtime: claude
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: code
      source: rhdh/harness/code.yaml
    - name: fix
      harness:
        agent: rhdh/agents/fix.md
        image: ghcr.io/redhat-developer/rhdh-fullsend-code:0.57.1
        policy: rhdh/policies/code.yaml
        host_files:
            - src: rhdh/env/rhdh-toolchain.env
              dest: /sandbox/workspace/.env.d/rhdh-toolchain.env
            - src: rhdh/env/yarn-proxy.env
              dest: /sandbox/workspace/.env.d/yarn-proxy.env
        skills:
            - skills/e2e-failure-analysis
    - name: review
      subagents:
        default: claude-opus-4-6
      harness:
        image: ghcr.io/redhat-developer/rhdh-fullsend-code:0.57.1
        skills:
            - skills/e2e-failure-analysis
    - name: e2e-triage
      source: rhdh/harness/e2e-triage.yaml
    - name: ci-diagnose
      source: rhdh/harness/ci-diagnose.yaml
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
models:
    aliases:
        opus: claude-opus-4-6
