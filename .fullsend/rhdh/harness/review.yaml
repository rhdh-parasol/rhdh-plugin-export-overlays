# Pinned to agents@v0.57.1 (commit ea29de9b), matching the fullsend@v0.57.1
# CLI our own .github/workflows/fullsend.yaml pins — these are companion
# releases cut together, so this is the harness content the installed CLI
# was actually built and tested against.
base: https://raw.githubusercontent.com/fullsend-ai/agents/ea29de9bb8b1729b04c0597b48a5c7aae62deb71/harness/review.yaml#sha256=c31ab2ff59b288ad1b8e3755751549c00c1606649cdb239bbbe5df58ba6f3112
image: ghcr.io/redhat-developer/rhdh-fullsend-code:0.57.1
# model: inherited from base (`opus`); models.aliases in rhdh-fullsend
# repos.yaml maps it for the review run. That mapping does not reach the
# upstream review sub-agents: their frontmatter asks for `opus`, `sonnet` or
# `haiku` and Claude Code resolves the alias itself, so pin all three inside
# the sandbox. Keep these in sync with models.aliases.
env:
  sandbox:
    ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5
    ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-5-5
    ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-5-5
# policy: inherited from base (policies/base.yaml + openshell providers/
# profiles for vertex-ai and, via the github forge overlay, github-ro).
skills:
  - skills/e2e-failure-analysis
